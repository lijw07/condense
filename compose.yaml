services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: condense
      POSTGRES_USER: condense
      POSTGRES_PASSWORD: condense
    ports:
      - "5432:5432"
    volumes:
      - condense-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condense"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - condense-ollama:/root/.ollama

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/condense
      DATABASE_USERNAME: condense
      DATABASE_PASSWORD: condense
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:?set EDGAR_USER_AGENT to "Your Name (you@example.com)"}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      SITE_URL: http://localhost:8080
      SESSION_COOKIE_SECURE: "false"
      CONDENSE_SUMMARIZER: ${CONDENSE_SUMMARIZER:-echo}
      CONDENSE_EMAIL_PROVIDER: ${CONDENSE_EMAIL_PROVIDER:-dev-inbox}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

volumes:
  condense-pgdata:
  condense-ollama:
