spring:
  application:
    name: condense
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 14d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: CONDENSE_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

springdoc:
  paths-to-match: /api/**, /auth/**
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method

condense:
  summarizer: ollama
  auth:
    link-lifetime: 24h
  email:
    provider: ${CONDENSE_EMAIL_PROVIDER:logging}
  edgar:
    base-url: https://data.sec.gov
    user-agent: ${EDGAR_USER_AGENT}
    request-timeout: 30s
    minimum-request-interval: 120ms
    max-document-chars: 400000
    bootstrap-companies: true
    tracked-forms:
      - 10-K
      - 10-Q
      - 8-K
      - 4
      - SC 13D
      - SC 13G
      - 13F-HR
  ollama:
    base-url: ${OLLAMA_BASE_URL}
    model: ${OLLAMA_MODEL:llama3.1:8b}
    request-timeout: 5m
    temperature: 0.1
    context-window-tokens: 16384
  dashboard:
    filing-history-limit: 25
  digest:
    from-address: ${DIGEST_FROM_ADDRESS:digest@condense.email}
    from-name: Condense
    site-url: ${SITE_URL:http://localhost:8080}
    max-tickers-per-subscriber: 10
    max-filings-per-digest: 12
  schedule:
    ingest-cron: "0 */20 6-20 * * MON-FRI"
    daily-digest-cron: "0 15 7 * * MON-FRI"
    weekly-digest-cron: "0 15 8 * * SAT"

logging:
  level:
    io.condense: INFO
