<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Condense digest</title>
</head>
<body style="font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; color: #1a1a1a; max-width: 640px;">
<h1 style="font-size: 18px; border-bottom: 1px solid #e5e5e5; padding-bottom: 8px;">
    Condense &middot; <span th:text="${content.digestDate}">date</span>
</h1>

<div th:each="item : ${content.items}" style="margin-bottom: 28px;">
    <div style="font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: #666;">
        <span th:text="${item.ticker}">TICK</span>
        &middot; <span th:text="${item.formType}">10-K</span>
        &middot; <span th:text="${item.significance}">ROUTINE</span>
    </div>
    <h2 style="font-size: 16px; margin: 6px 0;" th:text="${item.headline}">headline</h2>
    <ul style="padding-left: 18px; margin: 8px 0;">
        <li th:each="bullet : ${item.bullets}" th:text="${bullet}" style="margin-bottom: 4px;">bullet</li>
    </ul>
    <a th:href="${item.sourceUrl}" style="font-size: 13px; color: #1155cc;">Read the filing</a>
</div>

<p style="font-size: 12px; color: #666; border-top: 1px solid #e5e5e5; padding-top: 12px;">
    Condense reports what filings say. It is not investment advice.<br/>
    <a th:href="${content.manageUrl}" style="color: #666;">Manage your tickers</a>
    &middot;
    <a th:href="${content.unsubscribeUrl}" style="color: #666;">Unsubscribe</a>
</p>
</body>
</html>
