<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Condense</title>
    <style>
        :root {
            --ink: #16191d;
            --muted: #6b7280;
            --line: #e4e6ea;
            --accent: #1155cc;
            --bg: #ffffff;
            --surface: #f7f8fa;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 48px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.5;
        }

        main { max-width: 620px; margin: 0 auto; }

        h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
        h2 { font-size: 15px; margin: 32px 0 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
        p.lede { margin: 0 0 32px; color: var(--muted); }

        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

        input[type="email"], input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--ink);
        }

        input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

        button {
            font-family: inherit;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
        button.danger { background: transparent; color: #b42318; border-color: var(--line); }
        button:hover { filter: brightness(1.06); }

        .field { margin-bottom: 20px; }
        .row { display: flex; gap: 8px; align-items: flex-end; }
        .row > .field { flex: 1; margin-bottom: 0; }

        .results { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
        .results:empty { display: none; }
        .results li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
        .results li:hover { background: var(--surface); }
        .results .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 600; }
        .chip button { all: unset; cursor: pointer; color: var(--muted); font-weight: 400; }
        .chip button:hover { color: #b42318; }

        .card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .card h3 { margin: 0 0 4px; font-size: 15px; }
        .meta { font-size: 12px; color: var(--muted); }

        .notice { padding: 12px 14px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; margin-bottom: 20px; }
        .error { border-color: #f3c6c2; background: #fdf3f2; color: #b42318; }

        footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
        a { color: var(--accent); }
        .hidden { display: none; }
    </style>
</head>
<body></body>
</html>
